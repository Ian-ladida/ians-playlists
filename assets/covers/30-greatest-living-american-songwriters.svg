<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Pencil sketch cover art with the numeral 30">
  <defs>
    <filter id="penWobble" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" />
      <feDisplacementMap in="SourceGraphic" scale="1.6" />
    </filter>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.6" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="cv" cx="30%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#fbf3dc" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#ede3cc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="#ede3cc"/>
  <rect width="600" height="600" fill="url(#cv)"/>
  <rect width="600" height="600" filter="url(#paperGrain)" opacity="0.55"/>

  <g stroke="#2d2823" stroke-linecap="round" stroke-linejoin="round" fill="#2d2823" filter="url(#penWobble)">
    <!-- Top stave -->
    <g transform="translate(50,110) rotate(-1.4)">
      <g stroke-width="1.4" fill="none" opacity="0.85">
        <path d="M0 0 L500 0"/><path d="M0 12 L500 12"/><path d="M0 24 L500 24"/><path d="M0 36 L500 36"/><path d="M0 48 L500 48"/>
      </g>
      <path d="M14 -6 C 22 -2, 28 6, 22 16 C 16 26, 6 28, 4 22 C 2 16, 8 12, 14 16 C 22 22, 24 36, 18 48 C 14 56, 8 60, 4 58 M16 -6 L20 60" stroke-width="2.2" fill="none"/>
      <circle cx="20" cy="60" r="3"/>
      <ellipse cx="80" cy="28" rx="6" ry="4.2" transform="rotate(-18 80 28)"/>
      <path d="M85 28 L85 -10" stroke-width="1.4"/>
      <ellipse cx="120" cy="22" rx="6" ry="4.2" transform="rotate(-18 120 22)"/>
      <path d="M125 22 L125 -12" stroke-width="1.4"/>
      <ellipse cx="160" cy="32" rx="6" ry="4.2" transform="rotate(-18 160 32)"/>
      <path d="M165 32 L165 -8" stroke-width="1.4"/>
      <path d="M85 -12 L165 -8" stroke-width="3.4"/>
    </g>

    <!-- Bottom stave (fading) -->
    <g transform="translate(50,460) rotate(1.0)" opacity="0.85">
      <g stroke-width="1.4" fill="none" opacity="0.7">
        <path d="M0 0 L500 0"/><path d="M0 12 L500 12"/><path d="M0 24 L500 24"/><path d="M0 36 L500 36"/><path d="M0 48 L500 48"/>
      </g>
      <ellipse cx="60" cy="22" rx="6" ry="4.2" transform="rotate(-18 60 22)"/>
      <path d="M65 22 L65 -10" stroke-width="1.4"/>
      <ellipse cx="120" cy="30" rx="6" ry="4.2" transform="rotate(-18 120 30)"/>
      <path d="M125 30 L125 -8" stroke-width="1.4"/>
      <ellipse cx="180" cy="14" rx="6" ry="4.2" transform="rotate(-18 180 14)"/>
      <path d="M185 14 L185 -10" stroke-width="1.4"/>
      <path d="M260 16 Q300 28 340 16" stroke-width="1.4" fill="none"/>
      <path d="M380 14 L480 6" stroke-width="1.2" fill="none"/>
      <path d="M380 34 L480 42" stroke-width="1.2" fill="none"/>
    </g>

    <!-- Big "30" numeral, hand-drawn look -->
    <g transform="translate(178,228)">
      <!-- 3 -->
      <path d="M10 22 Q 70 -10, 110 30 Q 70 60, 30 60 Q 70 60, 116 70 Q 130 110, 100 138 Q 60 158, 14 130"
            stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- 0 -->
      <ellipse cx="220" cy="80" rx="58" ry="74" stroke-width="9" fill="none"/>
      <!-- pencil shading lines inside the 0 -->
      <path d="M186 50 L246 110" stroke-width="1.2" opacity="0.4"/>
      <path d="M192 60 L240 100" stroke-width="1.2" opacity="0.35"/>
      <path d="M196 72 L236 90" stroke-width="1.2" opacity="0.3"/>
    </g>
  </g>
</svg>
